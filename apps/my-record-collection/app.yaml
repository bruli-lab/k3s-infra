# Vault KV v2: k3s/argocd/my-record-collection
# Required properties: USERNAME and TOKEN (GitHub Contents: read-only).
# Apply this resource alongside the Application so credentials can be created
# before Argo CD needs to read the private repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-record-collection-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: my-record-collection-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/bruli-lab/myRecordCollection.git
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: argocd/my-record-collection
        property: USERNAME
    - secretKey: token
      remoteRef:
        key: argocd/my-record-collection
        property: TOKEN
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-record-collection
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: apps
spec:
  project: default
  source:
    repoURL: https://github.com/bruli-lab/myRecordCollection.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
