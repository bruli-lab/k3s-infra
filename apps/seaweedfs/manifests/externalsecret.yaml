apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: seaweedfs-s3-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        seaweedfs_s3_config: |
          {
            "identities": [
              {
                "name": "my-record-collection",
                "credentials": [
                  {
                    "accessKey": {{ .accessKey | toJson }},
                    "secretKey": {{ .secretKey | toJson }}
                  }
                ],
                "actions": ["Read:record-photos", "Write:record-photos"]
              }
            ]
          }
  data:
    - secretKey: accessKey
      remoteRef:
        key: storage/record-photos
        property: ACCESS_KEY
    - secretKey: secretKey
      remoteRef:
        key: storage/record-photos
        property: SECRET_KEY
