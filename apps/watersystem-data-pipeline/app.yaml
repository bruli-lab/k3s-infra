apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: watersystem-data-pipeline
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: apps
spec:
  project: default
  source:
    repoURL: https://github.com/bruli-lab/waterSystem-data-pipeline.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: watersystem-data-pipeline
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true